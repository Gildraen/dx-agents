name: validate
on:
  push:
    branches: [feat/component-extraction]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: go-task/setup-task@v2.2.0
        with:
          version: '3.53.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task validate && task test